apiVersion: 1

datasources:
  - name: HygieaPostgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: hygiea_db
    user: hygiea_user
    secureJsonData:
      password: hygiea_password
    jsonData:
      sslmode: disable
      maxOpenConns: 20
      maxIdleConns: 5
      connMaxLifetime: 14400
    isDefault: true
